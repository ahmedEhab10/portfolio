name: my_portfolio
description: "Ahmed Ehab — Flutter Developer Portfolio"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  url_launcher: ^6.2.5
  animate_do: ^3.3.4
  flutter_svg: ^2.0.9
  flutter_animate: ^4.5.2
  visibility_detector: ^0.4.0+2
  carousel_slider: ^5.0.0
  font_awesome_flutter: ^10.8.0
  animated_text_kit: ^4.2.2
  smooth_page_indicator: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/Fit_App/
    - assets/images/My_photo/
    - assets/pdf/
    - assets/images/Hobix_Tracker/
    - assets/images/Movies_app/
    - assets/images/Evently_app/
    
